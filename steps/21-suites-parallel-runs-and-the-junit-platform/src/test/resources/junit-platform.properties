# JUnit Jupiter: run test classes in parallel; the tests inside one class still run one after another
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = concurrent
# The JDK ForkJoinPool executor is the default; naming it explicitly hides JUnit's notice about the newer one
junit.jupiter.execution.parallel.config.executor-service = fork_join_pool
